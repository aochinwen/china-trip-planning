                        brand: {

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern reset & touch responsiveness */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Leaflet Tooltip & Popup Styling */
        .leaflet-tooltip.custom-tooltip, .leaflet-popup.custom-tooltip .leaflet-popup-content-wrapper {
            background-color: white;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 0.75rem;
            padding: 0;
            width: min(320px, calc(100vw - 32px));
            white-space: normal;
        }
        .leaflet-popup.custom-tooltip .leaflet-popup-content {
            margin: 0;
            line-height: inherit;
        }
        .leaflet-popup.custom-tooltip .leaflet-popup-tip-container {
            margin-top: -1px;
        }
        .leaflet-tooltip-top:before {
            border-top-color: white;
        }
        .leaflet-tooltip-bottom:before {
            border-bottom-color: white;
        }

        /* Persistent POI Label Styling */
        .poi-persistent-label {
            position: absolute;
            z-index: 450;
            pointer-events: auto;
            white-space: nowrap;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(229, 231, 235, 0.9);
            box-shadow: 0 2px 6px -1px rgba(0, 0, 0, 0.1), 0 1px 3px -1px rgba(0, 0, 0, 0.06);
            border-radius: 0.5rem;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            min-height: 28px;
        }
        .poi-persistent-label:hover {
            border-color: #0284c7;
            color: #0284c7;
            box-shadow: 0 4px 10px -1px rgba(2, 132, 199, 0.18);
            z-index: 460;
        }

        /* Airport Marker Styling */
        .airport-marker-wrapper {
            background: transparent;
            border: none;
        }
        .airport-marker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background-color: #6366f1;
            color: white;
            border-radius: 9999px;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(99, 102, 241, 0.45);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .airport-marker-container:hover {
            transform: scale(1.18);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.65);
        }

        /* Hotel Marker Styling (square badge, distinct from round POI/airport markers) */
        .hotel-marker-wrapper {
            background: transparent;
            border: none;
        }
        .hotel-marker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background-color: #d946ef;
            color: white;
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(217, 70, 239, 0.45);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .hotel-marker-container:hover {
            transform: scale(1.18);
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.65);
        }

        /* Train Station Marker Styling (diamond badge, distinct from hotel/POI/airport markers) */
        .train-marker-wrapper {
            background: transparent;
            border: none;
        }
        .train-marker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background-color: #f59e0b;
            color: white;
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(245, 158, 11, 0.45);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            transform: rotate(45deg);
        }
        .train-marker-container svg {
            transform: rotate(-45deg);
        }
        .train-marker-container:hover {
            transform: rotate(45deg) scale(1.18);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.65);
        }

        /* Custom Route Hover Tooltip Styling */
        .leaflet-tooltip.custom-route-tooltip {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }
        .leaflet-tooltip.custom-route-tooltip:before {
            display: none;
        }
        
        /* Map container height */
        #map {
            height: 100%;
            width: 100%;
            z-index: 10;
        }

        /* Custom scrollbar styling for trip list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }

        /* Bottom sheet drawer animation on mobile */
        @media (max-width: 767px) {
            .mobile-drawer {
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .mobile-drawer.collapsed {
                transform: translateY(calc(100% - 56px));
            }
            .mobile-drawer.expanded {
                transform: translateY(0);
            }
        }
    </style>
</head>

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

            if (ROUTE_TRAVEL_DATA[key]) {
                return ROUTE_TRAVEL_DATA[key];

            if (fromCo.city === toCo.city) {
                const dKm = Math.max(5, Math.round(haversineDistance(fromCo.lat, fromCo.lng, toCo.lat, toCo.lng) * 1.3));
                const driveMins = Math.max(15, Math.round(dKm * 2.2));

            // Collision Avoidance Layout Engine for Persistent POI Labels
            function updateLabelLayout() {
                const mapSize = map.getSize();
                const margin = 6; // pixel margin between label bounding boxes
                const placedBoxes = [];

                persistentLabels.forEach(item => {
                    const el = item.element;
                    const latlng = L.latLng(item.lat, item.lng);
                    const pt = map.latLngToContainerPoint(latlng);
                    const markerRadius = isMobile() ? 10 : 8;

                    // Hide label if marker is well outside visible container
                    if (pt.x < -120 || pt.x > mapSize.x + 120 || pt.y < -120 || pt.y > mapSize.y + 120) {
                        el.style.display = 'none';
                        return;
                    }

                    // Temporary render for dimension measurement
                    el.style.display = 'flex';
                    el.style.visibility = 'hidden';
                    const w = el.offsetWidth || 100;
                    const h = el.offsetHeight || 22;

                    // Candidate placement directions (relative to marker center pt)
                    const candidateOffsets = [
                        { x: pt.x - w / 2,         y: pt.y - markerRadius - h - 5 }, // Top
                        { x: pt.x + markerRadius + 6, y: pt.y - h / 2 },              // Right
                        { x: pt.x - w / 2,         y: pt.y + markerRadius + 5 }, // Bottom
                        { x: pt.x - markerRadius - w - 6, y: pt.y - h / 2 },          // Left
                        { x: pt.x + markerRadius + 3, y: pt.y - markerRadius - h },   // Top-Right
                        { x: pt.x + markerRadius + 3, y: pt.y + markerRadius + 2 },   // Bottom-Right
                        { x: pt.x - markerRadius - w - 3, y: pt.y - markerRadius - h },// Top-Left
                        { x: pt.x - markerRadius - w - 3, y: pt.y + markerRadius + 2 } // Bottom-Left
                    ];

                    let selectedBox = null;
                    let selectedPos = null;

                    for (const cand of candidateOffsets) {
                        const candBox = {
                            left: cand.x,
                            top: cand.y,
                            right: cand.x + w,
                            bottom: cand.y + h
                        };

                        let collides = false;
                        for (const placed of placedBoxes) {
                            if (
                                !(candBox.right + margin < placed.left ||
                                  candBox.left - margin > placed.right ||
                                  candBox.bottom + margin < placed.top ||
                                  candBox.top - margin > placed.bottom)
                            ) {
                                collides = true;
                                break;
                            }
                        }

                        if (!collides) {
                            selectedBox = candBox;
                            selectedPos = cand;
                            break;
                        }
                    }

                    if (selectedBox) {
                        const layerPt = map.containerPointToLayerPoint(L.point(selectedPos.x, selectedPos.y));
                        el.style.left = layerPt.x + 'px';
                        el.style.top = layerPt.y + 'px';
                        el.style.visibility = 'visible';
                        el.style.opacity = '1';
                        placedBoxes.push(selectedBox);
                    } else {
                        // Hide label if all 8 directions collide with higher-priority / existing labels
                        el.style.display = 'none';
                    }
                });
            }

            // Flatten an itinerary (array of day objects) into a single ordered stop list for rendering & routing

                    day.stops.forEach(stop => {
                        flat.push({ ...stop, day: day.day, date: day.date, accommodation: day.accommodation });
                    });
                });
                return flat;
            }

            function renderItinerary(mode) {
                const itin = ITINERARIES[mode].data;
                const list = document.getElementById('trip-list');
                const count = document.getElementById('trip-count');
                const flat = flattenItinerary(itin);
                const visitCount = flat.filter(s => s.type === 'visit').length;

                count.textContent = `${visitCount} stops · ${itin.length} days`;
                mobileTripBadge.textContent = `${visitCount} stops`;
                mobileTripBadge.classList.remove('hidden');

                const legendHtml = `
                    <div class="flex flex-wrap gap-2.5 text-[10px] text-gray-500 mb-2.5 px-0.5">
                        <span class="flex items-center gap-1"><span class="inline-block w-4 h-0.5 rounded-full" style="background:#0284c7"></span>Car / day trip</span>
                        <span class="flex items-center gap-1"><span class="inline-block w-4 h-0.5 rounded-full" style="background:#16a34a"></span>HSR</span>
                        <span class="flex items-center gap-1"><span class="inline-block w-4 h-0.5" style="background: repeating-linear-gradient(90deg, #6366f1 0 3px, transparent 3px 7px)"></span>Flight</span>
                    </div>
                `;

                let seq = 0;
                list.innerHTML = legendHtml + itin.map(day => `
                    <div class="mb-1">
                        <div class="flex items-baseline justify-between px-0.5 mb-1.5 mt-2 first:mt-0">
                            <span class="text-xs font-bold text-brand-800">${day.day} &middot; ${day.date}</span>
                            <span class="text-[10px] text-gray-400">🛏 ${day.accommodation}</span>
                        </div>
                        ${day.stops.map(stop => {
                            if (stop.type === 'flight' || stop.type === 'transport') {
                                const edgeRef = stop.edge ? stop.edge.edgeRef : null;
                                const fromCo = stop.fromId !== undefined ? companies[stop.fromId] : (stop.edge ? companies[stop.edge.fromId] : null);
                                const toCo = stop.toId !== undefined ? companies[stop.toId] : (stop.edge ? companies[stop.edge.toId] : null);
                                const travelData = edgeRef ? edgeRef.travelData : getRouteTravelData(fromCo, toCo);

                                const hoverAttrs = edgeRef !== null && edgeRef !== undefined
                                    ? `onmouseenter="hoverItineraryRoute(${edgeRef.index})" onmouseleave="leaveItineraryRoute(${edgeRef.index})"` 
                                    : '';

                                const transportBadges = travelData ? `
                                    <div class="mt-2 pt-1.5 border-t border-gray-200/60 grid grid-cols-3 gap-1 text-[10px] text-center">
                                        <div class="p-1 rounded ${travelData.flight.available ? 'bg-indigo-50 text-indigo-800 border border-indigo-100 font-medium' : 'bg-gray-100/60 text-gray-400'}">
                                            <span class="font-bold block">✈️ Flight</span>
                                            <span>${travelData.flight.available ? travelData.flight.time : 'N/A'}</span>
                                        </div>
                                        <div class="p-1 rounded ${travelData.hsr.available ? 'bg-emerald-50 text-emerald-800 border border-emerald-100 font-medium' : 'bg-gray-100/60 text-gray-400'}">
                                            <span class="font-bold block">🚄 HSR</span>
                                            <span>${travelData.hsr.available ? travelData.hsr.time : 'N/A'}</span>
                                        </div>
                                        <div class="p-1 rounded ${travelData.car.available ? 'bg-sky-50 text-sky-800 border border-sky-100 font-medium' : 'bg-gray-100/60 text-gray-400'}">
                                            <span class="font-bold block">🚗 Car</span>
                                            <span>${travelData.car.available ? travelData.car.time : 'N/A'}</span>
                                        </div>
                                    </div>
                                ` : '';

                                return `
                                    <div class="pl-2.5 pr-3 py-2 mb-1.5 border-l-2 border-dashed border-brand-400 text-[11px] text-gray-700 bg-gray-50/80 rounded-r-md hover:bg-brand-50/60 hover:border-brand-600 transition-all cursor-pointer shadow-2xs group" ${hoverAttrs}>
                                        <div class="flex items-center justify-between">
                                            <span class="font-bold text-brand-900">${stop.ampm}</span>
                                            <span class="text-[10px] font-semibold px-1.5 py-0.5 bg-brand-100/80 text-brand-800 rounded truncate">${stop.flightNo || (stop.type === 'flight' ? 'Flight' : 'Transit')}</span>
                                        </div>
                                        <div class="font-bold text-gray-900 text-xs mt-0.5">${stop.title || ''}</div>
                                        ${stop.details ? `<div class="text-gray-500 text-[10px] mt-0.5">${stop.details}</div>` : ''}
                                        ${transportBadges}
                                    </div>
                                `;
                            }
                            const co = companies[stop.id];
                            seq += 1;
                            const color = topicColors[co.topic] || '#000000';
                            return `
                                <div class="p-3 bg-white rounded-lg border border-gray-200 text-xs sm:text-sm flex items-start shadow-2xs mb-1.5 cursor-pointer hover:border-brand-300" onclick="focusItineraryStop(${stop.id})">
                                    <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center mr-2.5 shrink-0 mt-0.5">${seq}</span>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-1.5 mb-0.5">
                                            <span class="text-[10px] font-bold uppercase" style="color: ${color}">${stop.ampm}</span>
                                            <span class="text-[10px] text-gray-400">&middot; ${co.topic}</span>
                                        </div>
                                        <div class="font-semibold text-gray-800 leading-tight truncate">${stop.nameOverride || co.company}</div>
                                        <div class="text-[11px] text-gray-500 mt-0.5 truncate">${co.city} &middot; ${stop.poc}</div>
                                        ${stop.note ? `<div class="text-[11px] text-gray-500 mt-1 italic">${stop.note}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `).join('');

                copyBtn.classList.remove('hidden');
                copyBtn.innerHTML = `
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    Copy Itinerary
                `;
                clearBtn.classList.add('hidden'); // read-only preset: nothing to clear
            }

            window.focusItineraryStop = function(id) {
                const co = companies[id];
                const m = mapMarkers[id];
                map.panTo([co.lat, co.lng], { animate: true, duration: 0.4 });
                if (m) m.openPopup();
            };

            window.hoverItineraryRoute = function(index) {
                const edge = v2RouteLines[index];
                if (!edge) return;
                applyHoverFocus(new Set([edge.fromId, edge.toId]), new Set([edge]));
                const midIdx = Math.floor(edge.latlngs.length / 2);
                const midLatLng = L.latLng(edge.latlngs[midIdx][0], edge.latlngs[midIdx][1]);
                edge.hitLine.openTooltip(midLatLng);
            };

            window.leaveItineraryRoute = function(index) {
                const edge = v2RouteLines[index];
                if (edge) edge.hitLine.closeTooltip();
                clearHoverFocus();
            };

            const ROUTE_STYLES = {
                day:    { color: '#0284c7', weight: 3, opacity: 0.85, dashArray: null },   // solid blue — local car/day trip
                hsr:    { color: '#16a34a', weight: 3, opacity: 0.9,  dashArray: null },    // solid green — HSR/train
                flight: { color: '#6366f1', weight: 2.5, opacity: 0.9, dashArray: '2, 8' }  // dashed indigo arc — flight
            };

            // Quadratic-bezier arc between two points, for visually distinguishing flight legs from ground legs
            function arcLatLngs(a, b, curvature = 0.15, segments = 40) {
                const [lat1, lng1] = a, [lat2, lng2] = b;
                const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
                const dLat = lat2 - lat1, dLng = lng2 - lng1;
                const ctrlLat = midLat - dLng * curvature;
                const ctrlLng = midLng + dLat * curvature;
                const pts = [];
                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * ctrlLat + t * t * lat2;
                    const lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * ctrlLng + t * t * lng2;
                    pts.push([lat, lng]);
                }
                return pts;
            }

            // Build ordered (fromId, toId, edgeType) hops from the flattened itinerary.
            // 'transport' stops carry no coordinate themselves — they set the type of the
            // NEXT coordinate-bearing hop (HSR train no. => 'hsr', otherwise local car => 'day').
            function buildItineraryEdges(itin) {
                const flat = flattenItinerary(itin);
                const edges = [];
                let prevId = null;
                let pendingType = 'day';
                let pendingStop = null;

                flat.forEach(stop => {
                    delete stop.edge;
                    if (stop.type === 'transport') {
                        pendingType = /HSR/i.test(stop.title || '') ? 'hsr' : 'day';
                        pendingStop = stop;
                        return;
                    }
                    if (stop.type === 'flight') {
                        if (prevId !== null && prevId !== stop.fromId) {
                            const e = { fromId: prevId, toId: stop.fromId, type: pendingType, stop: pendingStop };
                            edges.push(e);
                            if (pendingStop) pendingStop.edge = e;
                            pendingStop = null;
                        }
                        const flightEdge = { fromId: stop.fromId, toId: stop.toId, type: 'flight', stop: stop };
                        edges.push(flightEdge);
                        stop.edge = flightEdge;
                        prevId = stop.toId;
                        pendingType = 'day';
                        return;
                    }
                    // visit
                    if (prevId !== null && prevId !== stop.id) {
                        const e = { fromId: prevId, toId: stop.id, type: pendingType, stop: pendingStop };
                        edges.push(e);
                        if (pendingStop) pendingStop.edge = e;
                        pendingStop = null;
                    }
                    prevId = stop.id;
                    pendingType = 'day';
                });

                return edges;
            }

            function emphasizeEdge(edge) {
                const style = ROUTE_STYLES[edge.type];
                edge.line.setStyle({ weight: style.weight + 3, opacity: 1 });
                edge.line.bringToFront();
            }

            function unemphasizeEdge(edge) {
                const style = ROUTE_STYLES[edge.type];
                edge.line.setStyle({ weight: style.weight, opacity: style.opacity });
            }

            function dimEdge(edge) {
                edge.line.setStyle({ opacity: 0.3 });
            }

            function emphasizeMarker(id) {
                const m = mapMarkers[id];
                if (!m) return;
                if (m.setStyle) {
                    m.setStyle({ color: '#f97316', weight: 5, fillOpacity: 1, opacity: 1 });
                    if (m.setRadius) m.setRadius((isMobile() ? 14 : 11) + 4);
                } else if (m.getElement) {
                    m.getElement().style.opacity = '1';
                    const iconEl = m.getElement()?.querySelector('.airport-marker-container');
                    if (iconEl) {
                        iconEl.style.transform = 'scale(1.5)';
                        iconEl.style.boxShadow = '0 0 0 4px #f97316, 0 4px 14px rgba(99, 102, 241, 0.8)';
                    }
                }
                const label = persistentLabels.find(l => l.id === id);
                if (label) label.element.style.opacity = '1';
            }

            function unemphasizeMarker(id) {
                const m = mapMarkers[id];
                if (!m) return;
                if (v2HighlightedIds.has(id)) {
                    highlightMarker(m);
                    if (m.setRadius) m.setRadius(isMobile() ? 14 : 11);
                } else {
                    dimMarker(id);
                }
            }

            // Hover focus: emphasize the active marker(s)/edge(s), fade everything else in
            // the itinerary scene to 30% opacity, restore all on mouseout.
            function applyHoverFocus(activeMarkerIds, activeEdges) {
                companies.forEach((c, id) => {
                    if (activeMarkerIds.has(id)) {
                        emphasizeMarker(id);
                    } else {
                        dimMarker(id);
                    }
                });
                v2RouteLines.forEach(edge => {
                    if (activeEdges.has(edge)) {
                        emphasizeEdge(edge);
                    } else {
                        dimEdge(edge);
                    }
                });
            }

            function clearHoverFocus() {
                companies.forEach((c, id) => unemphasizeMarker(id));
                v2RouteLines.forEach(edge => unemphasizeEdge(edge));
            }

            function drawItineraryRoute(mode) {
                const itin = ITINERARIES[mode].data;
                clearItineraryRoute();
                const edges = buildItineraryEdges(itin);

                edges.forEach((edge, index) => {
                    const a = [companies[edge.fromId].lat, companies[edge.fromId].lng];
                    const b = [companies[edge.toId].lat, companies[edge.toId].lng];
                    const style = ROUTE_STYLES[edge.type];
                    const latlngs = edge.type === 'flight' ? arcLatLngs(a, b) : [a, b];

                    const line = L.polyline(latlngs, {
                        color: style.color,
                        weight: style.weight,
                        opacity: style.opacity,
                        dashArray: style.dashArray,
                        lineJoin: 'round'
                    }).addTo(map);

                    // Wide invisible line layered under the visible one — much easier to hover than a 2-3px stroke
                    const hitLine = L.polyline(latlngs, {
                        color: '#000000',
                        weight: 22,
                        opacity: 0
                    }).addTo(map);

                    const fromCo = companies[edge.fromId];
                    const toCo = companies[edge.toId];
                    const travelData = getRouteTravelData(fromCo, toCo);

                    const edgeRef = { index, line, hitLine, fromId: edge.fromId, toId: edge.toId, type: edge.type, travelData, latlngs };
                    edge.edgeRef = edgeRef;
                    v2RouteLines.push(edgeRef);
                    (v2EdgesByMarker[edge.fromId] ||= []).push(edgeRef);
                    (v2EdgesByMarker[edge.toId] ||= []).push(edgeRef);

                    const tooltipContent = createRouteTooltipHtml(travelData, edge.type);

                    hitLine.bindTooltip(tooltipContent, {
                        sticky: true,
                        direction: 'top',
                        className: 'custom-route-tooltip',
                        offset: [0, -12]
                    });

                    hitLine.on('mouseover', () => {
                        applyHoverFocus(new Set([edgeRef.fromId, edgeRef.toId]), new Set([edgeRef]));
                        hitLine.openTooltip();
                    });
                    hitLine.on('mouseout', () => {
                        clearHoverFocus();
                        hitLine.closeTooltip();
                    });

                    [edge.fromId, edge.toId].forEach(id => {
                        if (!v2HighlightedIds.has(id)) {
                            v2HighlightedIds.add(id);
                            highlightMarker(mapMarkers[id]);
                        }
                    });
                });

                companies.forEach((c, id) => {
                    if (!v2HighlightedIds.has(id)) dimMarker(id);
                });

                let seq = 0;
                flattenItinerary(itin).filter(s => s.type === 'visit').forEach(stop => {
                    seq += 1;
                    const co = companies[stop.id];
                    const badge = L.divIcon({
                        className: '',
                        html: `<div class="flex items-center justify-center w-5 h-5 rounded-full bg-slate-800 text-white text-[10px] font-bold border-2 border-white shadow" style="transform: translate(10px, -10px);">${seq}</div>`,
                        iconSize: [0, 0]
                    });
                    v2RouteMarkers.push(L.marker([co.lat, co.lng], { icon: badge, interactive: false }).addTo(map));
                });
            }

            function clearItineraryRoute() {
                v2RouteLines.forEach(e => { map.removeLayer(e.line); map.removeLayer(e.hitLine); });
                v2RouteLines = [];
                v2EdgesByMarker = {};
                v2RouteMarkers.forEach(m => map.removeLayer(m));
                v2RouteMarkers = [];
                v2HighlightedIds.forEach(id => resetMarkerStyle(mapMarkers[id]));
                v2HighlightedIds.clear();
                companies.forEach((c, id) => undimMarker(id));
            }

            function copyBtnIconHtml(label) {
                return `
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    ${label}
                `;
            }

            function buildManualMessage() {
                return [
                    '*China Innovation Trip*',
                    '',
                    ...tripStops.map((stop, i) => `${i + 1}. ${stop.company}\n   ${stop.city} · ${stop.topic}`)
                ].join('\n\n');
            }

            function buildItineraryMessage(mode) {
                const itin = ITINERARIES[mode].data;
                const lines = [`*China Innovation Trip — ${ITINERARIES[mode].label}*`, ''];
                itin.forEach(day => {
                    lines.push(`*${day.day} · ${day.date}* (🛏 ${day.accommodation})`);
                    day.stops.forEach(stop => {
                        if (stop.type === 'flight' || stop.type === 'transport') {
                            lines.push(`   ${stop.ampm}: ${stop.title || ''}${stop.flightNo ? ` (${stop.flightNo})` : ''}${stop.details ? ` — ${stop.details}` : ''}`);
                        } else {
                            const co = companies[stop.id];
                            lines.push(`   ${stop.ampm}: ${stop.nameOverride || co.company} — ${co.city} · ${stop.poc}`);
                        }
                    });
                    lines.push('');
                });
                return lines.join('\n');
            }

            // Copy Trip for WhatsApp
            copyBtn.addEventListener('click', async () => {
                const isPreset = !!ITINERARIES[plannerMode];
                if (!isPreset && tripStops.length === 0) return;

                const message = isPreset ? buildItineraryMessage(plannerMode) : buildManualMessage();
                const defaultLabel = isPreset ? 'Copy Itinerary' : 'Copy for WhatsApp';

                try {
                    if (!navigator.clipboard || !navigator.clipboard.writeText) {
                        throw new Error('Clipboard API unavailable');
                    }
                    await navigator.clipboard.writeText(message);
                    copyBtn.textContent = 'Copied to Clipboard!';
                    setTimeout(() => {
                        copyBtn.innerHTML = copyBtnIconHtml(defaultLabel);
                    }, 1800);
                } catch (error) {
                    const fallback = document.createElement('textarea');
                    fallback.value = message;
                    fallback.setAttribute('aria-label', 'WhatsApp itinerary message');
                    fallback.style.position = 'fixed';
                    fallback.style.left = '50%';
                    fallback.style.top = '50%';
                    fallback.style.transform = 'translate(-50%, -50%)';
                    fallback.style.width = 'min(90vw, 420px)';
                    fallback.style.height = '160px';
                    fallback.style.padding = '12px';
                    fallback.style.zIndex = '1000';
                    document.body.appendChild(fallback);
                    fallback.focus();
                    fallback.select();
                    copyBtn.textContent = 'Text selected — press ⌘C / Ctrl+C';
                    setTimeout(() => {
                        fallback.remove();
                        copyBtn.innerHTML = copyBtnIconHtml(defaultLabel);
                    }, 6000);
                }
            });

            // Clear Trip
            clearBtn.addEventListener('click', () => {
                tripStops = [];
                updateTripUI();
            });

            // Expose remove function to window for inline HTML onclick
            window.removeStop = function(id) {
                const stopIndex = tripStops.findIndex(stop => stop.id === id);
                if (stopIndex > -1) {
                    tripStops.splice(stopIndex, 1);
                    updateTripUI();
                }
            };

            function updateTripUI() {
                const list = document.getElementById('trip-list');
                const count = document.getElementById('trip-count');
                
                count.textContent = `${tripStops.length} stops`;
                mobileTripBadge.textContent = `${tripStops.length} stops`;
                
                if (tripStops.length > 0) {
                    mobileTripBadge.classList.remove('hidden');
                } else {
                    mobileTripBadge.classList.add('hidden');
                }

                if (tripStops.length === 0) {
                    list.innerHTML = '<div class="text-xs text-gray-400 text-center py-6 border-2 border-dashed border-gray-200 rounded-lg">No stops added yet. Tap map markers to build route.</div>';
                    copyBtn.classList.add('hidden');
                    clearBtn.classList.add('hidden');
                } else {
                    list.innerHTML = tripStops.map((stop, i) => `
                        <div class="p-3 bg-white rounded-lg border border-gray-200 text-xs sm:text-sm flex items-start cursor-pointer hover:border-red-300 hover:bg-red-50/50 active:bg-red-50 transition-colors group shadow-2xs relative" onclick="removeStop(${stop.id})" title="Click to remove from trip">
                            
                            <!-- Stop Number Badge -->
                            <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center mr-2.5 shrink-0 mt-0.5 group-hover:bg-red-500 transition-colors z-10">${i + 1}</span>
                            
                            <!-- Details -->
                            <div class="flex-1 min-w-0">
                                <div class="font-semibold text-gray-800 leading-tight truncate">${stop.company}</div>
                                <div class="text-[11px] text-gray-500 mt-0.5">${stop.city} &middot; <span class="font-medium" style="color: ${topicColors[stop.topic]}">${stop.topic}</span></div>
                            </div>

                            <!-- Remove Icon -->
                            <button class="p-1 text-gray-300 group-hover:text-red-500 transition-colors shrink-0 ml-1" aria-label="Remove stop">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                            
                            <!-- Connecting line in UI -->
                            ${i !== tripStops.length - 1 ? '<div class="absolute left-6 top-8 bottom-[-16px] w-0.5 bg-gray-200 z-0"></div>' : ''}
                        </div>
                    `).join('');
                    copyBtn.classList.remove('hidden');
                    copyBtn.innerHTML = copyBtnIconHtml('Copy for WhatsApp');
                    clearBtn.classList.remove('hidden');
                }

                // Update marker highlights
                Object.values(mapMarkers).forEach(m => {
                    const stopIndex = tripStops.findIndex(s => s.id === m.companyData.id);
                    if (m.setStyle) {
                        if (stopIndex > -1) {
                            m.setStyle({ color: '#1e293b', weight: 4, fillOpacity: 1 });
                        } else {
                            m.setStyle({ color: '#ffffff', weight: 3, fillOpacity: 0.95 });
                        }
                    } else if (m.getElement) {
                        const iconEl = m.getElement()?.querySelector('.airport-marker-container');
                        if (iconEl) {
                            if (stopIndex > -1) {
                                iconEl.style.transform = 'scale(1.25)';
                                iconEl.style.boxShadow = '0 0 0 3px #1e293b, 0 4px 12px rgba(99, 102, 241, 0.7)';
                            } else {
                                iconEl.style.transform = '';
                                iconEl.style.boxShadow = '';
                            }
                        }
                    }
                });

                // Draw dashed lines on map connecting the points
                if (polylineLayer) {
                    map.removeLayer(polylineLayer);
                }
                
                if (tripStops.length > 1) {
                    const latlngs = tripStops.map(s => [s.lat, s.lng]);
                    
                    polylineLayer = L.polyline(latlngs, {
                        color: '#0284c7',
                        weight: 3,
                        opacity: 0.85,
                        dashArray: '8, 8',
                        lineJoin: 'round'
                    }).addTo(map);
                }
            }

            // Handle Resize
            window.addEventListener('resize', () => {
                map.invalidateSize();
                if (!isMobile()) {
                    sidebarDrawer.classList.remove('collapsed', 'expanded');
                    drawerBackdrop.classList.add('hidden');
                } else if (!isDrawerExpanded) {
                    sidebarDrawer.classList.add('collapsed');
                }
            });
        });
    </script>
</body>
</html>
